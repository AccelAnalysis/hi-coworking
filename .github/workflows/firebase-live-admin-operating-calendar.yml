name: Hi Coworking Firebase Admin operating calendar

on:
  push:
    branches:
      - main
    paths:
      - "apps/functions/src/bookingOperatingCalendar.ts"
      - "firebase/admin-operating-calendar-functions/**"
      - "firebase.admin-calendar.json"
      - "package.json"
      - "package-lock.json"
      - ".firebaserc"
      - ".github/workflows/firebase-live-admin-operating-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hi-coworking-firebase-admin-operating-calendar
  cancel-in-progress: false

jobs:
  deploy-admin-operating-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify Firebase deployment credential
        shell: bash
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT}" ]]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT (or FIREBASE_SERVICE_ACCOUNT)." >&2
            exit 1
          fi

      - name: Prepare Google application credentials
        shell: bash
        run: |
          set -euo pipefail
          credential_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${credential_file}"
          chmod 600 "${credential_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credential_file}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build isolated Admin operating-calendar bundle
        run: npm run build:admin-operating-calendar-deploy

      - name: Deploy Admin operating-calendar callables
        run: npm run deploy:admin-operating-calendar -- --non-interactive

      - name: Verify Admin operating-calendar endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://us-central1-hi-coworking-plat.cloudfunctions.net/booking_adminGetOperatingCalendar"
          response_file="${RUNNER_TEMP}/admin-operating-calendar-preflight.txt"
          status="$({ curl --silent --show-error --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://hi-coworking-plat.web.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            "${endpoint}"; } || true)"
          if [[ "${status}" != "200" && "${status}" != "204" ]]; then
            echo "booking_adminGetOperatingCalendar is not reachable after deployment (HTTP ${status})." >&2
            cat "${response_file}" >&2 || true
            exit 1
          fi
