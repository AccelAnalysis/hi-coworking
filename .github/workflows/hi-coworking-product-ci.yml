name: Hi Coworking product CI

on:
  pull_request:
    branches:
      - main
      # Lets the stacked confirmation-email test PR run product CI before it is retargeted to main.
      - cursor/power-now-confirm-email-e615
    paths:
      - "apps/functions/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "firebase/admin-member-functions/**"
      - "firebase/payment-status-guard-functions/**"
      - "firebase/expo-lead-functions/**"
      - "firebase/admin-event-functions/**"
      - "firebase/mail-functions/**"
      - "firebase/core-functions/**"
      - "firebase/campaign-functions/**"
      - "firebase/nurture-lifecycle-functions/**"
      - "firebase/event-series-functions/**"
      - "firebase/bookstore-functions/**"
      - "firebase/space-catalog-functions/**"
      - "firebase/member-record-functions/**"
      - "firebase.admin.json"
      - "firebase.admin-events.json"
      - "firebase.payment-status-guard.json"
      - "firebase.expo-lead.json"
      - "firebase.mail.json"
      - "firebase.campaign.json"
      - "firebase.core.json"
      - "firebase.nurture-lifecycle.json"
      - "firebase.event-series.json"
      - "firebase.bookstore.json"
      - "firebase.space-catalog.json"
      - "firebase.member-record.json"
      - ".github/workflows/firebase-live-mail-functions.yml"
      - ".github/workflows/firebase-live-core-functions.yml"
      - ".github/workflows/firebase-live-expo-lead-function.yml"
      - ".github/workflows/firebase-live-nurture-lifecycle.yml"
      - ".github/workflows/firebase-live-event-series.yml"
      - ".github/workflows/firebase-live-bookstore.yml"
      - ".github/workflows/firebase-live-space-catalog.yml"
      - ".github/workflows/firebase-live-member-record.yml"
      - "tests/functions/**"
      - "tests/rules/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hi-coworking-product-ci.yml"
      - ".github/workflows/firebase-live-admin-event-functions.yml"

permissions:
  contents: read

concurrency:
  group: hi-coworking-product-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build:shared

      - name: Build Cloud Functions
        run: npm run build:functions

      - name: Build split booking deploy bundles
        run: npm run build:booking-deploy

      - name: Build isolated Admin member deploy bundle
        run: npm run build:admin-member-deploy

      - name: Build isolated payment-status guard bundle
        run: npm run build:payment-status-guard-deploy

      - name: Build isolated expo lead bundle
        run: npm run build:expo-lead-deploy

      - name: Build isolated admin event deploy bundle
        run: npm run build:admin-event-deploy

      - name: Build isolated mail deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/mail-functions/tsconfig.json

      - name: Build isolated core deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/core-functions/tsconfig.json

      - name: Build isolated campaign deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/campaign-functions/tsconfig.json

      - name: Build isolated nurture lifecycle deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/nurture-lifecycle-functions/tsconfig.json

      - name: Build isolated event series deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/event-series-functions/tsconfig.json

      - name: Build isolated bookstore deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/bookstore-functions/tsconfig.json

      - name: Build isolated space catalog deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/space-catalog-functions/tsconfig.json

      - name: Build isolated member record deploy bundle
        run: npm run build --workspace functions -- --project ../../firebase/member-record-functions/tsconfig.json

      - name: Lint web application
        run: npm run lint

      - name: Run pure policy and source-contract tests
        run: >-
          npx vitest run
          tests/functions/home-map-runtime-safety.test.ts
          tests/functions/early-access-lead-capture.test.ts
          tests/functions/member-management-data-compat.test.ts
          tests/functions/payment-ledger-authority.test.ts
          tests/functions/payment-ledger-undefined-fields.test.ts
          tests/functions/stripe-subscription-invoices.test.ts
          tests/functions/membership-welcome-email.test.ts
          tests/functions/stripe-refund-notices.test.ts
          tests/functions/stripe-webhook-idempotency.test.ts
          tests/functions/quickbooks-webhook.test.ts
          tests/functions/qb-invoice-admin-only.test.ts
          tests/functions/member-notifications.test.ts
          tests/web/refund-copy.test.ts
          tests/functions/booking-policy.test.ts
          tests/functions/booking-operating-calendar.test.ts
          tests/functions/booking-operating-calendar-deployment-source.test.ts
          tests/functions/event-policy-v2.test.ts
          tests/functions/event-v2-source-contract.test.ts
          tests/functions/event-cancellation-policy.test.ts
          tests/functions/event-series-timezone.test.ts
          tests/functions/admin-member-operations-source.test.ts
          tests/functions/admin-booking-management-source.test.ts
          tests/functions/admin-event-save-cors.test.ts
          tests/functions/public-event-location.test.ts
          tests/functions/public-event-actions.test.ts
          tests/functions/expo-nasa-lead.test.ts
          tests/functions/intake-lead-store.test.ts
          tests/functions/stripe-subscription-updated.test.ts
          tests/functions/comp-membership.test.ts
          tests/functions/billing-portal.test.ts
          tests/functions/power-now-confirmation.test.ts
          tests/functions/power-now-interest.test.ts
          tests/functions/power-now-pitch-fields.test.ts
          tests/functions/expo-lead-deploy-workflow.test.ts
          tests/functions/mail-functions-deploy.test.ts
          tests/functions/core-functions-deploy.test.ts
          tests/functions/auth-provisioning.test.ts
          tests/functions/campaign-functions-deploy.test.ts
          tests/functions/resend-email-provider.test.ts
          tests/functions/sms-compliance.test.ts
          tests/functions/terms-acceptance.test.ts
          tests/functions/campaign-unsubscribe.test.ts
          tests/functions/admin-tools-deploy.test.ts
          tests/functions/admin-tools-source-contract.test.ts
          tests/functions/space-catalog-writes.test.ts
          tests/functions/admin-member-record.test.ts
          tests/functions/event-series-admin.test.ts
          tests/functions/bookstore-return-url.test.ts
          tests/web/event-series-form.test.ts
          tests/web/published-setups.test.ts
          tests/web/my-hi-nav.test.ts
          tests/web/public-rfx-quarantine.test.ts
          tests/web/membership-welcome-banner.test.ts
          tests/web/comp-membership-copy.test.ts
          tests/web/admin-back-navigation.test.ts
          tests/web/admin-booking-actions.test.ts
          tests/web/admin-a11y-guards.test.ts

      - name: Run active transaction integration tests
        run: >-
          npx firebase emulators:exec
          --project demo-hi-coworking
          --only auth,firestore,functions
          "npx vitest run
          tests/functions/booking-journey.test.ts
          tests/functions/bookstore-commerce.test.ts
          tests/functions/events-v2.test.ts
          tests/functions/event-interest-sms-optional.test.ts
          tests/functions/admin-member-credit.test.ts
          tests/functions/admin-booking-management.test.ts"

      - name: Run Events v2 Firestore rules tests
        run: >-
          npx firebase emulators:exec
          --project demo-hi-coworking
          --only firestore
          "npx vitest run tests/rules/events-v2.rules.test.ts"

      - name: Build production web application
        run: npm run build
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo

      - name: Verify Firebase Hosting serves exported Admin routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (config.hosting?.cleanUrls !== true) {
            throw new Error('Firebase Hosting cleanUrls must remain enabled for the Next.js static export.');
          }

          const routes = [
            'admin/dashboard',
            'admin/members',
            'admin/members/actions',
            'admin/roles',
            'admin/events',
            'staff',
          ];

          for (const route of routes) {
            const candidates = [
              path.join('apps/web/out', `${route}.html`),
              path.join('apps/web/out', route, 'index.html'),
            ];
            if (!candidates.some((candidate) => fs.existsSync(candidate))) {
              throw new Error(`Missing exported static route: /${route}`);
            }
          }
          NODE

      - name: Verify clean patch
        run: git diff --check
