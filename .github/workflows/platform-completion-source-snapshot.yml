name: Platform completion source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'feat/platform-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact completion branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Create source archive
        run: git archive --format=zip --output=platform-completion-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: platform-completion-source
          path: platform-completion-source.zip
          retention-days: 1
          if-no-files-found: error
