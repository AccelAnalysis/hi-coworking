name: Exchange onboarding journey

on:
  pull_request:
    paths:
      - "apps/functions/src/accounts.ts"
      - "apps/functions/src/exchange/businessActivation.ts"
      - "apps/functions/src/exchange/businessActivation.test.ts"
      - "apps/web/src/app/register/page.tsx"
      - "apps/web/src/app/exchange/onboarding/page.tsx"
      - "apps/web/src/app/exchange/page.tsx"
      - "apps/web/src/app/exchange/founding/page.tsx"
      - "tests/exchange/**"
      - "docs/exchange/business-onboarding-journey.md"
      - ".github/workflows/exchange-onboarding-journey.yml"
      - ".github/workflows/one-shot-onboarding-state.yml"

permissions:
  contents: write

jobs:
  patch-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-onboarding-journey
          fetch-depth: 0
      - name: Apply exact state transition patch
        run: |
          python - <<'PY'
          from pathlib import Path

          activation = Path("apps/functions/src/exchange/businessActivation.ts")
          text = activation.read_text()
          old = '''      patch.claimId = claimId;
      patch.claimStartedAt = Number(claim.get("createdAt") || now);
    } else if (input.data.action === "organization_selected" || input.data.action === "organization_created") {
      await loadOrgAuthority(transaction, store, input.data.organizationId, actor.uid, { managementRequired: false });
      patch.organizationId = input.data.organizationId;
      patch.organizationPath = input.data.action === "organization_created" ? "created" : "connected";
'''
          new = '''      patch.claimId = claimId;
      patch.claimStartedAt = Number(claim.get("createdAt") || now);
      patch.organizationSearchCompletedAt = state.organizationSearchCompletedAt ?? now;
    } else if (input.data.action === "organization_selected" || input.data.action === "organization_created") {
      await loadOrgAuthority(transaction, store, input.data.organizationId, actor.uid, { managementRequired: true });
      patch.organizationId = input.data.organizationId;
      patch.organizationPath = input.data.action === "organization_created" ? "created" : "connected";
      patch.organizationSearchCompletedAt = state.organizationSearchCompletedAt ?? now;
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one organization transition target, found {text.count(old)}")
          activation.write_text(text.replace(old, new))

          onboarding = Path("apps/web/src/app/exchange/onboarding/page.tsx")
          text = onboarding.read_text()
          for old, new in [
              ('{organizations.length > 0 &&', '{organizations.some((organization) => ["owner", "admin"].includes(organization.membershipRole)) &&'),
              ('{organizations.map((organization) =>', '{organizations.filter((organization) => ["owner", "admin"].includes(organization.membershipRole)).map((organization) =>'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one manageable-organization target, found {text.count(old)}")
              text = text.replace(old, new)
          onboarding.write_text(text)

          test = Path("tests/exchange/businessOnboardingJourney.test.ts")
          text = test.read_text()
          old = '    expect(activation).toContain("organizationClaims");\n'
          new = '''    expect(activation).toContain("organizationClaims");
    expect(activation).toContain("patch.organizationSearchCompletedAt = state.organizationSearchCompletedAt ?? now");
    expect(onboarding).toContain('["owner", "admin"].includes(organization.membershipRole)');
'''
          if text.count(old) != 1:
              raise SystemExit("Expected one organization-state test target")
          test.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/one-shot-onboarding-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/businessActivation.ts apps/web/src/app/exchange/onboarding/page.tsx tests/exchange/businessOnboardingJourney.test.ts .github/workflows/one-shot-onboarding-state.yml
          git commit -m "fix(exchange): complete connected-organization state transitions"
          git push origin HEAD:codex/exchange-business-onboarding-journey

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Run Exchange tests
        id: exchange-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:exchange -- --reporter=verbose 2>&1 | tee exchange-tests.log
      - name: Upload Exchange test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-onboarding-test-log
          path: exchange-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when Exchange tests fail
        if: steps.exchange-tests.outcome == 'failure'
        run: exit 1
      - name: Build Functions
        run: npm run build:functions
      - name: Build web application
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
        run: npm run build --workspace web
      - run: git diff --check
