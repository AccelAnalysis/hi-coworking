name: PR23 live callable diagnostic

on:
  push:
    branches:
      - codex/exchange-business-registration-map-activation
    paths:
      - .github/workflows/pr23-live-callable-diagnostic.yml
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - .github/workflows/pr23-live-callable-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Inspect repository contracts and live deployment
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/pr23-live-callable-diagnostic.txt"
          exec > >(tee "$OUT") 2>&1

          echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Repository head: $(git rev-parse HEAD)"
          echo
          echo "== Workflow inventory =="
          find .github/workflows -maxdepth 1 -type f -print | sort

          echo
          echo "== Relevant client call sites =="
          grep -RIn --exclude-dir=node_modules -E 'exchange_organizationDirectory|exchange_listActorOrganizations|businessReferral_listMine' apps/web/src | head -200 || true

          echo
          echo "== Relevant server exports =="
          grep -RIn --exclude-dir=node_modules -E 'export const (exchange_organizationDirectory|exchange_listActorOrganizations|businessReferral_listMine)|exchange_organizationDirectory,|exchange_listActorOrganizations,|businessReferral_listMine,' apps/functions/src | head -200 || true

          echo
          echo "== Hosting response =="
          curl --retry 2 --connect-timeout 15 --max-time 45 -sS -D - -o /tmp/exchange.html https://hi-coworking-plat.web.app/exchange || true
          echo "--- HTML first 1200 bytes ---"
          head -c 1200 /tmp/exchange.html 2>/dev/null || true
          echo
          echo "--- Build/static references ---"
          grep -oE '/_next/static/[^" ]+' /tmp/exchange.html 2>/dev/null | head -40 || true

          for FN in exchange_organizationDirectory exchange_listActorOrganizations businessReferral_listMine; do
            URL="https://us-central1-hi-coworking-plat.cloudfunctions.net/${FN}"
            echo
            echo "== ${FN}: OPTIONS =="
            curl --retry 2 --connect-timeout 15 --max-time 45 -sS -D - -o /tmp/body.txt \
              -X OPTIONS "$URL" \
              -H 'Origin: https://hi-coworking-plat.web.app' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type,x-firebase-appcheck,x-firebase-gmpid' || true
            echo "--- body ---"
            cat /tmp/body.txt 2>/dev/null || true

            case "$FN" in
              exchange_organizationDirectory)
                DATA='{"data":{"contractVersion":1,"pageSize":1}}'
                ;;
              exchange_listActorOrganizations)
                DATA='{"data":{"contractVersion":1,"persistSelection":false}}'
                ;;
              businessReferral_listMine)
                DATA='{"data":{"direction":"all","scope":"all","statuses":[],"limit":1}}'
                ;;
            esac

            echo
            echo "== ${FN}: anonymous callable POST =="
            curl --retry 2 --connect-timeout 15 --max-time 45 -sS -D - -o /tmp/body.txt \
              -X POST "$URL" \
              -H 'Origin: https://hi-coworking-plat.web.app' \
              -H 'Content-Type: application/json' \
              --data "$DATA" || true
            echo "--- body ---"
            cat /tmp/body.txt 2>/dev/null || true
          done

          echo
          echo "== Firebase project metadata (unauthenticated best effort) =="
          npx --yes firebase-tools@latest projects:list --json 2>&1 || true

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr23-live-callable-diagnostic
          path: pr23-live-callable-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
