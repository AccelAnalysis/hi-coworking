name: PR23 publication diagnostic PR runner

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - ".github/workflows/pr23-publication-diagnostic-pr-runner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Execute corrected publication diagnostic patch
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee publication-patch.log
          from pathlib import Path
          source = Path(".github/workflows/pr23-publication-diagnostic-runner.yml").read_text()
          raw = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          exec(compile(script, "pr23-publication-diagnostic-runner", "exec"))
          PY
      - name: Upload publication patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-publication-patch-log
          path: publication-patch.log
          if-no-files-found: error
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run lint
      - run: npm run test:exchange
      - run: npm run build
      - run: git diff --check
      - name: Commit validated publication diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/organizationEstablishments.ts apps/functions/src/index.ts apps/web/src/app/org/settings/page.tsx tests/exchange/organizationPublicationDiagnostic.test.ts
          git commit -m "feat(exchange): add publication visibility diagnostic"
          git pull --rebase origin codex/exchange-business-registration-map-activation
          git push origin HEAD:codex/exchange-business-registration-map-activation
