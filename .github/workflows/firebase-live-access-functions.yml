name: Hi Coworking Firebase access (door code) functions

# Manual only. Never runs on push or merge.
# Door access go-live and redeploys (Jonathan approved Nov 24, 2026, 5:24 PM ET):
#   1. Confirms the Firebase SEAM_API_KEY is for Seam workspace "Jonathan's Production".
#   2. Points the Seam webhook at us-central1 access_seamWebhook and syncs SEAM_WEBHOOK_SECRET.
#   3. Deploys the access functions from firebase/access-functions (Seam secrets only).
#   4. Creates or completes the Floor Entrance doors record.
#   5. Checks the deployed webhook fails closed.
# Never reads, changes or deletes access codes on the lock.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy access functions to run the door access go-live steps and deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hi-coworking-firebase-access-functions
  cancel-in-progress: false

jobs:
  deploy-access-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT || secrets.FIREBASE_SERVICE_ACCOUNT }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirm }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require the typed confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Refusing to deploy from ${GITHUB_REF}. Run this workflow from main." >&2
            exit 1
          fi
          if [[ "${DEPLOY_CONFIRMATION}" != "deploy access functions" ]]; then
            echo "Confirmation did not match. Type exactly: deploy access functions" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Firebase deployment credential
        shell: bash
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT}" ]]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT (or FIREBASE_SERVICE_ACCOUNT)." >&2
            exit 1
          fi

      - name: Prepare Google application credentials
        shell: bash
        run: |
          set -euo pipefail
          credential_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${credential_file}"
          chmod 600 "${credential_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credential_file}" >> "${GITHUB_ENV}"
          gcloud auth activate-service-account --key-file="${credential_file}" >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Guard the Firebase project
        shell: bash
        run: |
          set -euo pipefail
          node -e "const rc=require('./.firebaserc'); if (rc.projects?.default !== 'hi-coworking-plat') { throw new Error('Refusing: .firebaserc default project is not hi-coworking-plat'); }"

      - name: Load the Seam key from Secret Manager (masked)
        shell: bash
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access latest --secret=SEAM_API_KEY --project=hi-coworking-plat)"
          echo "::add-mask::${key}"
          echo "SEAM_API_KEY=${key}" >> "${GITHUB_ENV}"

      - name: Confirm the Seam key is for the production workspace
        run: node scripts/door-access-go-live.mjs verify

      - name: Point the Seam webhook at access_seamWebhook and sync its secret
        run: node scripts/door-access-go-live.mjs webhook

      # firebase.access.json's predeploy builds the isolated bundle first.
      # --only keeps every other default-codebase function in place. Never add the force flag.
      - name: Deploy access functions
        run: npx firebase deploy --config firebase.access.json --project hi-coworking-plat --only functions:access_getMyGrants,functions:access_adminResendPin,functions:access_adminRevoke,functions:access_adminUnlock,functions:access_adminGetDoorStatus,functions:access_adminRetryCode,functions:access_adminResolveAlert,functions:access_onRevokeRequested,functions:access_seamWebhook,functions:access_expireGrants,functions:access_noShowRevoke --non-interactive

      - name: Create or complete the Floor Entrance door record
        run: node scripts/door-access-go-live.mjs door

      - name: Check the deployed webhook fails closed
        run: node scripts/door-access-go-live.mjs smoke
