name: PR23 marker repair diagnostic

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - "tests/exchange/organization-marker-public-discovery-repair.test.ts"
      - "apps/web/src/features/exchange/data/publicOrganizationRepository.ts"
      - ".github/workflows/pr23-marker-repair-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused marker repair test
        shell: bash
        run: |
          set -o pipefail
          npx vitest run tests/exchange/organization-marker-public-discovery-repair.test.ts --reporter=verbose 2>&1 | tee focused-test.log
      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-focused-test-log
          path: focused-test.log
          if-no-files-found: error
