name: PR23 Exchange test diagnostic

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - "tests/exchange/**"
      - "apps/web/src/features/exchange/**"
      - ".github/workflows/pr23-marker-repair-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exchange-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Run complete Exchange test suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:exchange 2>&1 | tee exchange-test.log
      - name: Upload Exchange test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-exchange-test-log
          path: exchange-test.log
          if-no-files-found: error
