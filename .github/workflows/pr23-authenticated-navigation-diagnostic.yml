name: PR23 authenticated navigation diagnostic

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - .github/workflows/pr23-authenticated-navigation-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-authenticated-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: exchange-development
    env:
      EXCHANGE_DEV_BASE_URL: ${{ secrets.EXCHANGE_DEV_BASE_URL }}
      EXCHANGE_DEV_TEST_EMAIL: ${{ secrets.EXCHANGE_DEV_TEST_EMAIL }}
      EXCHANGE_DEV_TEST_PASSWORD: ${{ secrets.EXCHANGE_DEV_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm required configured-development inputs
        shell: bash
        run: |
          test -n "$EXCHANGE_DEV_BASE_URL"
          test -n "$EXCHANGE_DEV_TEST_EMAIL"
          test -n "$EXCHANGE_DEV_TEST_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Reproduce Exchange to Profile navigation
        shell: bash
        run: |
          cat > pr23-authenticated-navigation.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          import crypto from "node:crypto";

          const baseURL = process.env.EXCHANGE_DEV_BASE_URL;
          const email = process.env.EXCHANGE_DEV_TEST_EMAIL;
          const password = process.env.EXCHANGE_DEV_TEST_PASSWORD;
          const diagnostics = {
            baseHost: new URL(baseURL).host,
            startedAt: new Date().toISOString(),
            navigation: [],
            functions: [],
            requestFailures: [],
            pageErrors: [],
            consoleErrors: [],
          };
          const hash = (value) => crypto.createHash("sha256").update(String(value)).digest("hex").slice(0, 12);
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();

          page.on("response", async (response) => {
            const request = response.request();
            let url;
            try { url = new URL(response.url()); } catch { return; }
            if (!url.hostname.endsWith("cloudfunctions.net")) return;
            const entry = {
              functionName: url.pathname.split("/").filter(Boolean).at(-1),
              status: response.status(),
              method: request.method(),
              payloadKeys: [],
            };
            try {
              const raw = request.postDataJSON();
              const data = raw && typeof raw === "object" ? raw.data : null;
              if (data && typeof data === "object" && !Array.isArray(data)) {
                entry.payloadKeys = Object.keys(data).sort();
                if (typeof data.actorOrganizationId === "string") entry.actorOrganizationIdHash = hash(data.actorOrganizationId);
                if (typeof data.organizationId === "string") entry.organizationIdHash = hash(data.organizationId);
                if (typeof data.subjectOrganizationId === "string") entry.subjectOrganizationIdHash = hash(data.subjectOrganizationId);
              }
            } catch {}
            if (response.status() >= 400) {
              try {
                const body = await response.json();
                entry.errorStatus = body?.error?.status ?? null;
                entry.errorMessage = body?.error?.message ?? null;
                entry.issuePaths = Array.isArray(body?.error?.details?.issues)
                  ? body.error.details.issues.map((issue) => issue?.path ?? "").slice(0, 12)
                  : [];
              } catch {
                entry.errorStatus = "non-json";
              }
            }
            diagnostics.functions.push(entry);
          });

          page.on("requestfailed", (request) => {
            let url;
            try { url = new URL(request.url()); } catch { return; }
            if (!url.hostname.endsWith("cloudfunctions.net")) return;
            diagnostics.requestFailures.push({
              functionName: url.pathname.split("/").filter(Boolean).at(-1),
              failure: request.failure()?.errorText ?? "unknown",
            });
          });
          page.on("pageerror", (error) => diagnostics.pageErrors.push({ name: error.name, message: error.message.slice(0, 400) }));
          page.on("console", (message) => {
            if (message.type() !== "error") return;
            diagnostics.consoleErrors.push(message.text().replaceAll(email, "[redacted-email]").slice(0, 500));
          });

          try {
            await page.goto(new URL("/login", baseURL).toString(), { waitUntil: "domcontentloaded", timeout: 45_000 });
            diagnostics.navigation.push({ step: "login", status: "loaded" });
            await page.getByLabel("Email").fill(email);
            await page.getByLabel("Password").fill(password);
            await page.getByRole("button", { name: "Sign in" }).click();
            await page.waitForURL(/\/exchange(?:\?|$)/, { timeout: 45_000 });
            diagnostics.navigation.push({ step: "exchange", status: "loaded" });
            await page.waitForTimeout(6_000);
            await page.getByRole("button", { name: "Open account menu" }).click();
            await page.getByRole("link", { name: "Profile" }).click();
            await page.waitForURL(/\/profile(?:\?|$)/, { timeout: 45_000 });
            diagnostics.navigation.push({ step: "profile", status: "loaded" });
            await page.waitForTimeout(6_000);
          } catch (error) {
            diagnostics.navigation.push({ step: "failure", status: String(error).slice(0, 600) });
          } finally {
            diagnostics.finishedAt = new Date().toISOString();
            fs.writeFileSync("pr23-authenticated-navigation-diagnostic.json", JSON.stringify(diagnostics, null, 2));
            await page.screenshot({ path: "pr23-authenticated-navigation-final.png", fullPage: true }).catch(() => {});
            await browser.close();
          }

          const relevantFailures = diagnostics.functions.filter((entry) => entry.status >= 400);
          console.log(JSON.stringify({
            navigation: diagnostics.navigation,
            functionStatuses: diagnostics.functions.map(({ functionName, status, payloadKeys, errorStatus, issuePaths }) => ({ functionName, status, payloadKeys, errorStatus, issuePaths })),
            requestFailures: diagnostics.requestFailures,
            pageErrors: diagnostics.pageErrors,
            relevantFailureCount: relevantFailures.length,
          }, null, 2));
          EOF
          node ./pr23-authenticated-navigation.mjs

      - name: Upload authenticated diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-authenticated-navigation-diagnostic
          path: |
            pr23-authenticated-navigation-diagnostic.json
            pr23-authenticated-navigation-final.png
          if-no-files-found: error
          retention-days: 3
