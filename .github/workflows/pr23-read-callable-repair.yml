      - name: Install dependencies
        run: npm ci

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run tests/exchange/callable-read-payload-normalization.test.ts
          npm run build:shared
          npm run build:functions
          npm run lint
          npm run test:exchange
          npm run test:run3
          npm run build --workspace web
