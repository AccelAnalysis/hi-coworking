      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/callableReadPayloads.ts \
            apps/web/src/features/exchange/data/organizationContextGateway.ts \
            apps/web/src/lib/functions.ts \
            tests/exchange/callable-read-payload-normalization.test.ts
