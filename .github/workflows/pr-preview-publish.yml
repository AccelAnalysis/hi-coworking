name: Hi Coworking PR preview publish

on:
  workflow_run:
    workflows:
      - Hi Coworking PR preview build
    types:
      - completed
  pull_request_target:
    types:
      - closed

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: hi-coworking-pr-preview-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve source PR
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const match = String(run.display_title || '').match(/PR #(\d+)/);
              prNumber = match ? Number(match[1]) : undefined;
            }
            if (!prNumber) {
              core.setFailed('Could not resolve a pull request number from the preview build run.');
              return;
            }
            core.setOutput('pr-number', String(prNumber));

      - name: Download built preview
        uses: actions/download-artifact@v4
        with:
          name: hi-coworking-pages-preview
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact against current PR head
        id: validate
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR_NUMBER);
            const metadata = JSON.parse(fs.readFileSync('incoming/preview-meta.json', 'utf8'));
            const current = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (current.data.state !== 'open') {
              core.info(`PR #${prNumber} is no longer open; skipping publication.`);
              core.setOutput('publish', 'false');
              return;
            }

            if (current.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info(`PR #${prNumber} comes from a fork; publication is disabled.`);
              core.setOutput('publish', 'false');
              return;
            }

            if (
              metadata.prNumber !== prNumber ||
              metadata.headSha !== current.data.head.sha ||
              metadata.headRepository !== current.data.head.repo.full_name
            ) {
              core.info(`Artifact for PR #${prNumber} is stale; a newer run will publish instead.`);
              core.setOutput('publish', 'false');
              return;
            }

            const root = `https://${context.repo.owner}.github.io/${context.repo.repo}`;
            core.setOutput('publish', 'true');
            core.setOutput('directory', `pr-${prNumber}`);
            core.setOutput('url', `${root}/pr-${prNumber}/`);
            core.setOutput('exchange-url', `${root}/pr-${prNumber}/exchange/`);

      - name: Prepare combined Pages branch
        if: steps.validate.outputs.publish == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DIRECTORY: ${{ steps.validate.outputs.directory }}
          PR_NUMBER: ${{ steps.target.outputs.pr-number }}
        run: |
          set -euo pipefail
          rm -f incoming/preview-meta.json

          mkdir site
          cd site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cd ..

          if [[ ! -f site/index.html ]]; then
            cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="robots" content="noindex,nofollow" />
            <title>Hi Coworking PR Previews</title>
          </head>
          <body>
            <main style="font-family:system-ui,sans-serif;max-width:720px;margin:64px auto;padding:0 24px;line-height:1.5">
              <h1>Hi Coworking PR previews</h1>
              <p>Preview links are posted on each pull request. This review site is isolated from the live Hi Coworking deployment.</p>
            </main>
          </body>
          </html>
          HTML
          fi

          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll

          rm -rf "site/${TARGET_DIRECTORY}"
          mkdir -p "site/${TARGET_DIRECTORY}"
          cp -a incoming/. "site/${TARGET_DIRECTORY}/"

          while IFS= read -r -d '' file; do
            sed -i '0,/<head>/s//<head><meta name="robots" content="noindex,nofollow" \/>/' "$file" || true
          done < <(find "site/${TARGET_DIRECTORY}" -type f -name '*.html' -print0)

          cd site
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish Hi Coworking preview for PR #${PR_NUMBER}"
            git push origin gh-pages
          fi

      - name: Remove Git metadata
        if: steps.validate.outputs.publish == 'true'
        run: rm -rf site/.git

      - name: Configure GitHub Pages
        if: steps.validate.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        if: steps.validate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy combined Pages site
        if: steps.validate.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post or update PR preview link
        if: steps.validate.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.validate.outputs.url }}
          EXCHANGE_URL: ${{ steps.validate.outputs.exchange-url }}
          PR_NUMBER: ${{ steps.target.outputs.pr-number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const marker = '<!-- hi-coworking-pr-preview -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.SOURCE_RUN_ID}`;
            const body = `${marker}\n## Hi Coworking PR Preview\n\n✅ **Preview ready:** [Open PR #${prNumber} preview](${process.env.PREVIEW_URL})\n\n[Open the Exchange view](${process.env.EXCHANGE_URL})\n\nUse this URL on iPhone, iPad, or desktop for visual acceptance before merge. The preview uses non-production Firebase placeholders, so authentication, Firestore writes, Functions, Storage, Stripe, and other server-backed actions fail closed rather than touching the live project. Map rendering is enabled when the repository variable \`NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN\` is configured.\n\nThis preview does **not** alter \`www.hi-coworking.com\` or Firebase Hosting.\n\n[Preview build run](${runUrl})`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Remove closed PR preview from publication branch
        id: cleanup
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          mkdir site
          cd site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --depth=1 origin gh-pages
          git checkout -B gh-pages FETCH_HEAD
          rm -rf "pr-${PR_NUMBER}"
          git add --all

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Remove Hi Coworking preview for PR #${PR_NUMBER}"
          git push origin gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Remove Git metadata
        if: steps.cleanup.outputs.changed == 'true'
        run: rm -rf site/.git

      - name: Configure GitHub Pages
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload cleaned Pages artifact
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy cleaned Pages site
        if: steps.cleanup.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark preview as removed
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- hi-coworking-pr-preview -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (!existing) return;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: `${marker}\n## Hi Coworking PR Preview\n\nPreview removed because PR #${prNumber} is closed.`,
            });
