name: Hi Coworking PR preview build
run-name: PR #${{ github.event.pull_request.number }} visual preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: hi-coworking-pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Resolve preview path
        shell: bash
        run: |
          preview_path="pr-${{ github.event.pull_request.number }}"
          base_path="/${{ github.event.repository.name }}/${preview_path}"
          echo "HI_COWORKING_PREVIEW_PATH=${preview_path}" >> "$GITHUB_ENV"
          echo "PAGES_BASE_PATH=${base_path}" >> "$GITHUB_ENV"

      - name: Build isolated static visual preview
        run: npm run build
        env:
          HI_COWORKING_PAGES_PREVIEW: "1"
          PAGES_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}

      - name: Prepare preview artifact metadata
        shell: bash
        run: |
          test -f apps/web/out/index.html
          printf 'User-agent: *\nDisallow: /\n' > apps/web/out/robots.txt
          cat > apps/web/out/preview-meta.json <<EOF
          {
            "prNumber": ${{ github.event.pull_request.number }},
            "headSha": "${{ github.event.pull_request.head.sha }}",
            "headRepository": "${{ github.event.pull_request.head.repo.full_name }}",
            "basePath": "${PAGES_BASE_PATH}"
          }
          EOF

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: hi-coworking-pages-preview
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7

      - name: Record preview target
        shell: bash
        run: |
          root="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "### Visual preview target" >> "$GITHUB_STEP_SUMMARY"
          echo "${root}/${HI_COWORKING_PREVIEW_PATH}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Exchange: ${root}/${HI_COWORKING_PREVIEW_PATH}/exchange/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This build uses non-production Firebase placeholders. The existing Exchange security workflow remains the merge-quality gate." >> "$GITHUB_STEP_SUMMARY"
