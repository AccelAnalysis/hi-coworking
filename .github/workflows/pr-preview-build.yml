name: Hi Coworking PR preview build
run-name: PR #${{ github.event.pull_request.number }} Firebase preview build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: hi-coworking-pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head without submodule processing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${PR_HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify current Firebase-hosted baseline
        shell: bash
        run: |
          set -euo pipefail
          base="https://hi-coworking-plat.web.app"
          curl --fail --silent --show-error --location --retry 3 \
            "${base}/__/firebase/init.json" \
            --output /tmp/hi-live-firebase.json
          curl --fail --silent --show-error --location --retry 3 \
            "${base}/" \
            --output /tmp/hi-live-home.html
          for route in spaces pricing events bookstore about contact book; do
            curl --fail --silent --show-error --location --retry 3 \
              "${base}/${route}" \
              --output "/tmp/hi-live-${route}.html"
          done
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/hi-live-firebase.json', 'utf8'));
          if (config.projectId !== 'hi-coworking-plat') {
            throw new Error(`Live Firebase project mismatch: ${config.projectId}`);
          }
          const home = fs.readFileSync('/tmp/hi-live-home.html', 'utf8');
          const requiredNavigation = ['Spaces', 'Pricing', 'Events', 'Bookstore', 'About', 'Contact'];
          for (const label of requiredNavigation) {
            if (!home.includes(label)) {
              throw new Error(`Live home page is missing public navigation label: ${label}`);
            }
          }
          const book = fs.readFileSync('/tmp/hi-live-book.html', 'utf8');
          if (!book.includes('Book')) {
            throw new Error('Live booking route did not return the Hi Coworking booking surface.');
          }
          NODE
          echo "Verified ${base}: Firebase project, six-link public navigation, and public booking route are reachable." >> "$GITHUB_STEP_SUMMARY"

      - name: Build isolated static visual preview
        run: npm run build
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}

      - name: Prepare preview artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          printf 'User-agent: *\nDisallow: /\n' > apps/web/out/robots.txt
          cat > apps/web/out/preview-meta.json <<EOF
          {
            "prNumber": ${{ github.event.pull_request.number }},
            "headSha": "${{ github.event.pull_request.head.sha }}",
            "headRepository": "${{ github.event.pull_request.head.repo.full_name }}"
          }
          EOF

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: hi-coworking-firebase-preview
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7

      - name: Record isolation boundary
        shell: bash
        run: |
          echo "### Firebase PR preview artifact ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Built exact PR head ${{ github.event.pull_request.head.sha }} with demo Firebase browser configuration." >> "$GITHUB_STEP_SUMMARY"
          echo "Compared the build against the actual Firebase-hosted hi-coworking-plat.web.app baseline." >> "$GITHUB_STEP_SUMMARY"
          echo "A separate trusted workflow on main is responsible for deploying this artifact to an isolated Firebase Hosting preview channel." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow cannot deploy the live channel and receives no Firebase deployment credential." >> "$GITHUB_STEP_SUMMARY"
