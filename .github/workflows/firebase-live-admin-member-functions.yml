name: Hi Coworking Firebase Admin member functions

on:
  push:
    branches:
      - main
    paths:
      - "apps/functions/src/adminMemberOperations.ts"
      - "apps/functions/src/adminMembershipAuthority.ts"
      - "apps/functions/src/adminMemberOperationsAuthority.ts"
      - "apps/functions/src/adminMemberBookingAuthority.ts"
      - "apps/functions/src/access.ts"
      - "apps/functions/src/payments/**"
      - "apps/functions/package.json"
      - "firebase/admin-member-functions/**"
      - "firebase.admin.json"
      - "package.json"
      - "package-lock.json"
      - ".firebaserc"
      - ".github/workflows/firebase-live-admin-member-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hi-coworking-firebase-admin-member-functions
  cancel-in-progress: false

jobs:
  deploy-admin-member-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify Firebase deployment credential
        shell: bash
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT}" ]]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT (or FIREBASE_SERVICE_ACCOUNT)." >&2
            echo "Add a Firebase/Google Cloud service-account JSON with permission to deploy Gen 2 Functions, then re-run this workflow." >&2
            exit 1
          fi

      - name: Prepare Google application credentials
        shell: bash
        run: |
          set -euo pipefail
          credential_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${credential_file}"
          chmod 600 "${credential_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credential_file}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build isolated Admin member bundle
        run: npm run build:admin-member-deploy

      - name: Deploy Admin member transaction functions
        run: npm run deploy:admin-member -- --non-interactive
