name: Exchange security

on:
  pull_request:
  push:
    branches:
      - "codex/exchange-run-1-secure-foundation"
      - "codex/exchange-run-3-economic-intelligence"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run lint
      - name: Run Exchange tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:exchange 2>&1 | tee exchange-test.log
      - run: npm run test:security
      - run: npm run test:run3
      - run: npm run test:run4
      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee exchange-build.log
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
          NEXT_PUBLIC_EXCHANGE_DEMO_MODE: "true"
      - name: Upload Exchange test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-test-log
          path: exchange-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-production-build-log
          path: exchange-build.log
          if-no-files-found: ignore
          retention-days: 7
      - run: git diff --check
