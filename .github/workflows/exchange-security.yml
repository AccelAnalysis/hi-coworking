name: Exchange security

on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/exchange-run-1-secure-foundation"]

permissions:
  contents: read

jobs:
  verify:
    # The Exchange surface guarded by this workflow is retired. Keep the
    # verification available for legacy Exchange branches without making it
    # a gate for active Hi Coworking product work.
    if: >-
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'codex/exchange-') ||
      startsWith(github.head_ref, 'exchange/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run build:booking-deploy
      - name: Verify public booking deploy has no external secret bindings
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "SENDGRID_API_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|SEAM_API_KEY|SEAM_WEBHOOK_SECRET" firebase/booking-public-functions/lib; then
            echo "Public booking deploy bundle unexpectedly contains an external API secret identifier." >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
      - run: git diff --check
