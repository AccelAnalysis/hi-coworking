name: Dependency audit diagnostic

on:
  pull_request:
    branches:
      - codex/exchange-configured-acceptance-and-seed-activation
    paths:
      - ".github/workflows/dependency-audit-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply dependency constraints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.overrides = {
            ...(root.overrides || {}),
            'fast-xml-parser': '5.10.1',
            sharp: '0.35.3',
          };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const functionsPath = 'apps/functions/package.json';
          const functions = JSON.parse(fs.readFileSync(functionsPath, 'utf8'));
          functions.dependencies.sharp = '0.35.3';
          fs.writeFileSync(functionsPath, JSON.stringify(functions, null, 2) + '\n');
          NODE
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean installation
        run: npm ci
      - name: Capture remediated production audit
        shell: bash
        run: npm audit --omit=dev --json > audit-after.json || true
      - name: Upload remediated dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediated-production-dependencies
          path: |
            package.json
            package-lock.json
            apps/functions/package.json
            audit-after.json
          retention-days: 1
      - name: Require clean production audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          const total = Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0);
          if (total !== 0) {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          NODE
