name: Dependency audit remediation

on:
  pull_request:
    branches:
      - codex/exchange-configured-acceptance-and-seed-activation
    paths:
      - ".github/workflows/dependency-audit-diagnostic.yml"

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'fix/sam-gov-server-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/sam-gov-server-integration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply dependency constraints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.overrides = {
            ...(root.overrides || {}),
            'fast-xml-parser': '5.10.1',
            sharp: '0.35.3',
            '@google-cloud/storage': {
              ...((root.overrides || {})['@google-cloud/storage'] || {}),
              'fast-xml-parser': '5.10.1',
            },
            next: {
              ...((root.overrides || {}).next || {}),
              sharp: '0.35.3',
            },
          };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const functionsPath = 'apps/functions/package.json';
          const functions = JSON.parse(fs.readFileSync(functionsPath, 'utf8'));
          functions.dependencies.sharp = '0.35.3';
          fs.writeFileSync(functionsPath, JSON.stringify(functions, null, 2) + '\n');
          NODE
      - name: Regenerate targeted lockfile entries
        run: npm update fast-xml-parser sharp --workspaces --include-workspace-root --package-lock-only --ignore-scripts
      - name: Verify clean installation and production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=low
      - name: Commit audited remediation
        shell: bash
        run: |
          rm .github/workflows/dependency-audit-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/functions/package.json .github/workflows/dependency-audit-diagnostic.yml
          git diff --cached --check
          git commit -m "fix(deps): resolve production audit advisories"
          git push origin HEAD:fix/sam-gov-server-integration
