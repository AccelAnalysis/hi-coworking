name: Exchange Week 1 Organization Reconciliation

on:
  pull_request:
    paths:
      - "apps/functions/src/exchange/organizationModel.ts"
      - "apps/functions/src/exchange/organizations.ts"
      - "apps/functions/src/profiles.ts"
      - "apps/web/src/app/exchange/onboarding/**"
      - "apps/web/src/app/admin/exchange-claims/**"
      - "apps/web/src/app/profile/**"
      - "apps/web/src/lib/profileUpdateDiagnostics.ts"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "tests/browser/exchange-organization-reconciliation.spec.ts"
      - "tests/exchange/week1-organization-reconciliation.test.ts"
      - ".github/workflows/exchange-week1-org-reconciliation.yml"
  workflow_dispatch:

jobs:
  organization-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run lint
      - run: npm run test:exchange
      - run: npm run test:week1-org
      - run: npx playwright install --with-deps chromium
      - run: npm run build:shared && npm run build:functions && npx firebase emulators:exec --project demo-hi-coworking --only auth,firestore,functions,storage "npm run test:browser:week1-org"
      - run: git diff --check
