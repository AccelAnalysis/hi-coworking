# Exact one-shot patch; this workflow removes itself after a successful commit.
name: One-shot onboarding state hardening

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-onboarding-journey
          fetch-depth: 0
      - name: Apply exact state transition patch
        run: |
          python - <<'PY'
          from pathlib import Path

          activation = Path("apps/functions/src/exchange/businessActivation.ts")
          text = activation.read_text()
          old = '''      patch.claimId = claimId;
      patch.claimStartedAt = Number(claim.get("createdAt") || now);
    } else if (input.data.action === "organization_selected" || input.data.action === "organization_created") {
      await loadOrgAuthority(transaction, store, input.data.organizationId, actor.uid, { managementRequired: false });
      patch.organizationId = input.data.organizationId;
      patch.organizationPath = input.data.action === "organization_created" ? "created" : "connected";
'''
          new = '''      patch.claimId = claimId;
      patch.claimStartedAt = Number(claim.get("createdAt") || now);
      patch.organizationSearchCompletedAt = state.organizationSearchCompletedAt ?? now;
    } else if (input.data.action === "organization_selected" || input.data.action === "organization_created") {
      await loadOrgAuthority(transaction, store, input.data.organizationId, actor.uid, { managementRequired: true });
      patch.organizationId = input.data.organizationId;
      patch.organizationPath = input.data.action === "organization_created" ? "created" : "connected";
      patch.organizationSearchCompletedAt = state.organizationSearchCompletedAt ?? now;
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one organization transition target, found {text.count(old)}")
          activation.write_text(text.replace(old, new))

          onboarding = Path("apps/web/src/app/exchange/onboarding/page.tsx")
          text = onboarding.read_text()
          replacements = [
              (
                  '{organizations.length > 0 &&',
                  '{organizations.some((organization) => ["owner", "admin"].includes(organization.membershipRole)) &&',
              ),
              (
                  '{organizations.map((organization) =>',
                  '{organizations.filter((organization) => ["owner", "admin"].includes(organization.membershipRole)).map((organization) =>',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one manageable-organization target, found {text.count(old)}")
              text = text.replace(old, new)
          onboarding.write_text(text)

          test = Path("tests/exchange/businessOnboardingJourney.test.ts")
          text = test.read_text()
          old = '    expect(activation).toContain("organizationClaims");\n'
          new = '''    expect(activation).toContain("organizationClaims");
    expect(activation).toContain("patch.organizationSearchCompletedAt = state.organizationSearchCompletedAt ?? now");
    expect(onboarding).toContain('["owner", "admin"].includes(organization.membershipRole)');
'''
          if text.count(old) != 1:
              raise SystemExit("Expected one organization-state test target")
          test.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/one-shot-onboarding-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/businessActivation.ts apps/web/src/app/exchange/onboarding/page.tsx tests/exchange/businessOnboardingJourney.test.ts
          git commit -m "fix(exchange): complete connected-organization state transitions"
          git push origin HEAD:codex/exchange-business-onboarding-journey
