name: Exchange test diagnostic

on:
  pull_request:
    branches:
      - codex/exchange-configured-acceptance-and-seed-activation
    paths:
      - ".github/workflows/exchange-test-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture Exchange test report
        shell: bash
        run: npx vitest run tests/exchange --reporter=json --outputFile=exchange-test-report.json || true
      - name: Upload Exchange test report
        uses: actions/upload-artifact@v4
        with:
          name: exchange-test-report
          path: exchange-test-report.json
          retention-days: 1
