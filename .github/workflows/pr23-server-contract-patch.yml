name: PR23 server perspective contract patch

on:
  push:
    branches:
      - codex/exchange-business-registration-map-activation
    paths:
      - ".github/workflows/pr23-server-contract-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded perspective contract repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/functions/src/exchange/organizationWorkspace.ts")
          text = path.read_text()

          replacements = [
              (
                  'import { createHash } from "node:crypto";',
                  'import { createHash, randomUUID } from "node:crypto";',
              ),
              (
                  'import { HttpsError, onCall, type CallableRequest } from "firebase-functions/v2/https";\n',
                  'import { HttpsError, onCall, type CallableRequest } from "firebase-functions/v2/https";\nimport * as logger from "firebase-functions/logger";\n',
              ),
              (
                  'type PerspectiveInput = z.infer<typeof perspectiveInputSchema>;\n\nasync function resolvePerspective(\n  request: CallableRequest<unknown>,\n  input: PerspectiveInput,\n): Promise<RecordData> {',
                  '''type PerspectiveInput = z.infer<typeof perspectiveInputSchema>;

function viewerUidHash(uid: string): string {
  return createHash("sha256").update(uid).digest("hex").slice(0, 16);
}

async function resolveValidatedSecondary(
  db: FirebaseFirestore.Firestore,
  secondary: PerspectiveInput["secondary"],
  subjectOrganizationId: string,
  privateAllowed: boolean,
): Promise<ExchangeSecondaryContext | undefined> {
  if (!secondary) return undefined;
  if (secondary.type !== "establishment") return secondary as ExchangeSecondaryContext;
  const collection = privateAllowed
    ? "organizationLocations"
    : "publicOrganizationLocations";
  const snapshot = await db.collection(collection).doc(secondary.id).get();
  const location = asRecord(snapshot.data());
  const belongsToSubject = snapshot.exists
    && location.organizationId === subjectOrganizationId
    && location.status === "active";
  const publicProjectionValid = privateAllowed || (
    location.coordinatePublicationApproved === true
    && typeof location.latitude === "number"
    && Number.isFinite(location.latitude)
    && typeof location.longitude === "number"
    && Number.isFinite(location.longitude)
  );
  if (!belongsToSubject || !publicProjectionValid) {
    throw new HttpsError("not-found", "Organization establishment unavailable");
  }
  return secondary as ExchangeSecondaryContext;
}

async function resolvePerspective(
  request: CallableRequest<unknown>,
  input: PerspectiveInput,
  requestId: string,
): Promise<RecordData> {''',
              ),
              (
                  '  const privateAllowed = Boolean(self || managed);\n  const subjectAvailable = Boolean(',
                  '  const privateAllowed = Boolean(self || managed);\n  const secondary = await resolveValidatedSecondary(\n    db,\n    input.secondary,\n    input.subjectOrganizationId,\n    privateAllowed,\n  );\n  const subjectAvailable = Boolean(',
              ),
              (
                  '    ...(input.secondary ? { secondary: input.secondary as ExchangeSecondaryContext } : {}),',
                  '    ...(secondary ? { secondary } : {}),',
              ),
              (
                  '  return {\n    contractVersion: CONTRACT_VERSION,',
                  '''  logger.info("Organization perspective resolved", {
    requestId,
    callable: "exchange_resolveOrganizationPerspective",
    viewerUidHash: viewerUidHash(authorizedViewer.uid),
    actorOrganizationId: selectedActor?.organizationId ?? null,
    subjectOrganizationId: input.subjectOrganizationId,
    secondaryType: secondary?.type ?? null,
    secondaryId: secondary?.id ?? null,
    projectionLevel: model.projectionLevel,
  });

  return {
    contractVersion: CONTRACT_VERSION,''',
              ),
              (
                  '''export const exchange_resolveOrganizationPerspective = onCall(async (request) => {
  const input = parseInput(perspectiveInputSchema, request.data);
  return resolvePerspective(request, input);
});''',
                  '''export const exchange_resolveOrganizationPerspective = onCall(async (request) => {
  const requestId = randomUUID();
  try {
    const input = parseInput(perspectiveInputSchema, request.data);
    return await resolvePerspective(request, input, requestId);
  } catch (error) {
    logger.warn("Organization perspective failed", {
      requestId,
      callable: "exchange_resolveOrganizationPerspective",
      viewerUidHash: request.auth?.uid ? viewerUidHash(request.auth.uid) : null,
      failureCode: error instanceof HttpsError ? error.code : "internal",
    });
    throw error;
  }
});''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guarded replacement expected once, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run test:exchange
      - run: git diff --check
      - name: Commit validated server repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/organizationWorkspace.ts
          git commit -m "fix(exchange): validate establishment perspective context"
          git push origin HEAD:codex/exchange-business-registration-map-activation
