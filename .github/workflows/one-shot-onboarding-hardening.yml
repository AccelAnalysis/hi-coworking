name: One-shot onboarding hardening

on:
  push:
    branches:
      - codex/exchange-business-onboarding-journey

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-onboarding-journey
          fetch-depth: 0
      - name: Apply exact hardening patch
        run: |
          python - <<'PY'
          from pathlib import Path

          onboarding = Path("apps/web/src/app/exchange/onboarding/page.tsx")
          text = onboarding.read_text()
          old = '        preferredOrientation: true,\n'
          new = '        preferredOrientation: payload.visibility !== "private",\n'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one preferred-orientation target, found {text.count(old)}")
          text = text.replace(old, new)
          old = '      console.warn("Business address confirmation failed", { code: (value as { code?: string }).code || "unknown" });\n      setLocalError("We could not confirm that address. Check the street, city, state, and ZIP code, then try again.");\n'
          new = '      console.warn("Business address confirmation failed", { code: (value as { code?: string }).code || "unknown" });\n      void recordProgress({ action: "geocoding_failed", organizationId }).catch(() => undefined);\n      setLocalError("We could not confirm that address. Check the street, city, state, and ZIP code, then try again.");\n'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one geocoding-failure target, found {text.count(old)}")
          onboarding.write_text(text.replace(old, new))

          activation = Path("apps/functions/src/exchange/businessActivation.ts")
          text = activation.read_text()
          replacements = [
              (
                  '    geocoding_completed: "geocoding_succeeded",\n',
                  '    geocoding_completed: "geocoding_succeeded",\n    geocoding_failed: "geocoding_failed",\n',
              ),
              (
                  '    z.object({ action: z.literal("geocoding_completed"), organizationId: ID, establishmentId: ID }).strict(),\n',
                  '    z.object({ action: z.literal("geocoding_completed"), organizationId: ID, establishmentId: ID }).strict(),\n    z.object({ action: z.literal("geocoding_failed"), organizationId: ID }).strict(),\n',
              ),
              (
                  '["profile_completion_offered", "enrichment_offered", "founding_membership_offered", "checkout_handoff_initiated", "onboarding_completed"]',
                  '["geocoding_failed", "profile_completion_offered", "enrichment_offered", "founding_membership_offered", "checkout_handoff_initiated", "onboarding_completed"]',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one backend target, found {text.count(old)}: {old[:80]}")
              text = text.replace(old, new)
          activation.write_text(text)

          test = Path("tests/exchange/businessOnboardingJourney.test.ts")
          text = test.read_text()
          old = '    expect(activation).toContain("addressMatchesGeography");\n'
          new = '    expect(activation).toContain("addressMatchesGeography");\n    expect(onboarding).toContain(\'preferredOrientation: payload.visibility !== "private"\');\n'
          if text.count(old) != 1:
              raise SystemExit("Expected onboarding privacy assertion target")
          text = text.replace(old, new)
          old = '    expect(activation).toContain("organizationClaims");\n'
          new = '    expect(activation).toContain("organizationClaims");\n    expect(activation).toContain(\'geocoding_failed: "geocoding_failed"\');\n    expect(onboarding).toContain(\'action: "geocoding_failed"\');\n'
          if text.count(old) != 1:
              raise SystemExit("Expected analytics assertion target")
          test.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/one-shot-onboarding-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/businessActivation.ts apps/web/src/app/exchange/onboarding/page.tsx tests/exchange/businessOnboardingJourney.test.ts
          git commit -m "fix(exchange): harden private marker and geocode failure paths"
          git push origin HEAD:codex/exchange-business-onboarding-journey
