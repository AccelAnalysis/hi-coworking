name: Reconstruct visual designer source

on:
  push:
    branches:
      - feature/apple-hig-space-designer
    paths:
      - ".designer-staging-gz/READY"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/apple-hig-space-designer

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail

          {
            cat .designer-staging-gz/page.gzpart.00.*
            cat .designer-staging-gz/page.gzpart.01
            cat .designer-staging-gz/page.gzpart.02
            cat .designer-staging-gz/page.gzpart.03
            cat .designer-staging-gz/page.gzpart.04
            cat .designer-staging-gz/page.gzpart.05
            cat .designer-staging-gz/page.gzpart.06
            cat .designer-staging-gz/page.gzpart.07
          } | base64 --decode | gzip --decompress > apps/web/src/app/admin/builder/page.tsx

          {
            cat .designer-staging-gz/canvas.gzpart.00.*
            cat .designer-staging-gz/canvas.gzpart.01.*
            cat .designer-staging-gz/canvas.gzpart.02
          } | base64 --decode | gzip --decompress > apps/web/src/components/floorplan/FloorplanCanvas.tsx

          echo "6b3459b36c1825a7e1ee38776564978704809478771bd5d7f7200cece6e2b005  apps/web/src/app/admin/builder/page.tsx" | sha256sum --check
          echo "d440691fb617b5fa8fe298a654bd438f034b8070757b9283349b2d86c1edf83b  apps/web/src/components/floorplan/FloorplanCanvas.tsx" | sha256sum --check

          rm -rf .designer-staging .designer-staging-gz
          rm -f .github/workflows/reconstruct-designer.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign visual space designer"
          git push origin HEAD:feature/apple-hig-space-designer
