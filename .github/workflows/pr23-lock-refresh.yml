name: PR23 dependency lock repair

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - ".github/workflows/pr23-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply safe web dependency resolution
        run: |
          npm install --workspace web --save-exact postcss@8.5.19 sharp@0.35.3 --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm dedupe --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Verify repaired dependency tree
        run: npm ls postcss sharp next --all
      - name: Reinstall from repaired manifests
        run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run lint
      - run: npm run test:exchange
      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee dependency-build.log
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
          NEXT_PUBLIC_EXCHANGE_DEMO_MODE: "true"
      - name: Upload dependency build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-dependency-build-log
          path: dependency-build.log
          if-no-files-found: error
      - run: git diff --check
      - name: Commit validated dependency repair
        run: |
          if git diff --quiet -- apps/web/package.json package-lock.json; then
            echo "Dependency manifests already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          git commit -m "fix(deps): repair Exchange production dependency audit"
          git pull --rebase origin codex/exchange-business-registration-map-activation
          git push origin HEAD:codex/exchange-business-registration-map-activation
