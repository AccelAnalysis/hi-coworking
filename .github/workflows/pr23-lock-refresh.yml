name: PR23 dependency lock diagnostic

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - ".github/workflows/pr23-lock-refresh.yml"
      - "apps/web/package.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test safe web pins and non-breaking audit repair
        shell: bash
        run: |
          set -o pipefail
          npm install --workspace web --save-exact postcss@8.5.19 sharp@0.35.3 --ignore-scripts 2>&1 | tee lock-refresh.log
          npm audit fix --omit=dev --ignore-scripts 2>&1 | tee -a lock-refresh.log
          npm dedupe --ignore-scripts 2>&1 | tee -a lock-refresh.log
          git diff --stat -- apps/web/package.json package-lock.json | tee -a lock-refresh.log
          npm ls postcss sharp next --all 2>&1 | tee -a lock-refresh.log || true
      - name: Verify production dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=low 2>&1 | tee -a lock-refresh.log
      - name: Upload dependency diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-lock-diagnostic
          path: lock-refresh.log
          if-no-files-found: error
