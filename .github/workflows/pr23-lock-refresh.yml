name: PR23 final repair gate

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - ".github/workflows/pr23-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded application repairs
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee final-repair-patch.log
          from pathlib import Path

          def extract(path: str) -> str:
              source = Path(path).read_text()
              raw = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
              return "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())

          publication = extract(".github/workflows/pr23-publication-diagnostic-patch.yml")
          strict = '''def replace_once(path: Path, old: str, new: str) -> None:
    text = path.read_text()
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{path}: guarded replacement expected once, found {count}: {old[:100]!r}")
    path.write_text(text.replace(old, new, 1))'''
          idempotent = '''def replace_once(path: Path, old: str, new: str) -> None:
    text = path.read_text()
    count = text.count(old)
    if path.name == "index.ts" and "exchange_getOrganizationPublicationDiagnostic" in new:
        if count == 2:
            path.write_text(text.replace(old, new))
            return
        if count == 0 and text.count(new) == 2:
            return
    if count != 1:
        raise SystemExit(f"{path}: guarded replacement expected once, found {count}: {old[:100]!r}")
    path.write_text(text.replace(old, new, 1))'''
          if strict not in publication:
              raise SystemExit("Could not locate publication replacement helper")
          exec(compile(publication.replace(strict, idempotent, 1), "publication-patch", "exec"))

          server = extract(".github/workflows/pr23-server-contract-corrected.yml")
          needle = '''        actorOrganizationId: input.actorOrganizationId,
        subjectOrganizationId: input.organizationId,
        mode: input.mode,'''
          replacement = '''        contractVersion: CONTRACT_VERSION,
        actorOrganizationId: input.actorOrganizationId,
        subjectOrganizationId: input.organizationId,
        mode: input.mode,'''
          if server.count(needle) != 2:
              raise SystemExit(f"Expected two directory perspective call patterns, found {server.count(needle)}")
          exec(compile(server.replace(needle, replacement), "server-patch", "exec"))
          PY
      - name: Upload application patch output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-final-repair-patch-log
          path: final-repair-patch.log
          if-no-files-found: error
      - name: Apply safe web dependency resolution
        run: |
          npm install --workspace web --save-exact postcss@8.5.19 sharp@0.35.3 --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm dedupe --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Verify repaired dependency tree
        run: npm ls postcss sharp next --all
      - name: Reinstall from repaired manifests
        run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run lint
      - run: npm run test:exchange
      - run: npm run test:security
      - run: npm run test:run3
      - run: npm run test:run4
      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee final-repair-build.log
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
          NEXT_PUBLIC_EXCHANGE_DEMO_MODE: "true"
      - name: Upload production build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-final-repair-build-log
          path: final-repair-build.log
          if-no-files-found: error
      - run: git diff --check
      - name: Commit validated final repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/organizationWorkspace.ts apps/functions/src/exchange/organizationEstablishments.ts apps/functions/src/index.ts apps/web/src/app/org/settings/page.tsx tests/exchange/organizationPublicationDiagnostic.test.ts apps/web/package.json package-lock.json
          git commit -m "fix(exchange): complete marker discovery and security repair"
          git pull --rebase origin codex/exchange-business-registration-map-activation
          git push origin HEAD:codex/exchange-business-registration-map-activation
