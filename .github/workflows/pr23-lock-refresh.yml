name: PR23 validated repair commit

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - ".github/workflows/pr23-lock-refresh.yml"
      - "scripts/pr23-final-repair.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-validated-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Recreate validated application repair
        run: python3 scripts/pr23-final-repair.py
      - name: Recreate validated dependency repair
        run: |
          npm install --workspace web --save-exact postcss@8.5.19 sharp@0.35.3 --ignore-scripts
          npm audit fix --omit=dev --ignore-scripts
          npm dedupe --ignore-scripts
          npm audit --omit=dev --audit-level=low
          npm ci
          git diff --check
      - name: Commit and push validated repair
        shell: bash
        run: |
          set -o pipefail
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/functions/src/exchange/organizationWorkspace.ts apps/functions/src/exchange/organizationEstablishments.ts apps/functions/src/index.ts apps/web/src/app/org/settings/page.tsx tests/exchange/organizationPublicationDiagnostic.test.ts apps/web/package.json package-lock.json
            git status --short
            if git diff --cached --quiet; then
              echo "Validated repair is already committed."
              exit 0
            fi
            git commit -m "fix(exchange): complete marker discovery and security repair"
            git push origin HEAD:refs/heads/codex/exchange-business-registration-map-activation
          } 2>&1 | tee final-repair-commit.log
      - name: Upload commit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-final-repair-commit-log
          path: final-repair-commit.log
          if-no-files-found: warn
