name: Exchange web build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/exchange-web-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee exchange-build.log
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
          NEXT_PUBLIC_EXCHANGE_DEMO_MODE: "true"
      - name: Upload production build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-web-build-log
          path: exchange-build.log
          if-no-files-found: ignore
          retention-days: 7
