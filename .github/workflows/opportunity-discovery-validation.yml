name: Opportunity discovery validation

on:
  pull_request:
    branches:
      - codex/exchange-run-4-founding-launch
    paths:
      - "apps/web/src/features/exchange/**"
      - "apps/functions/src/**"
      - "packages/shared/src/**"
      - "packages/shared/package.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "scripts/*opportunity-discovery*"
      - "docs/exchange/opportunity-discovery*"
      - ".github/workflows/opportunity-discovery-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ""
      NEXT_PUBLIC_MAPBOX_GEOCODING_ENDPOINT: "https://api.mapbox.com/search/geocode/v6/forward"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        shell: bash
        run: |
          if [[ -f .nvmrc ]]; then
            echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Discovery contract validation
        run: node scripts/validate-opportunity-discovery.mjs

      - name: Generate 100-record fixture
        run: node scripts/generate-opportunity-discovery-fixtures.mjs 100 tmp/opportunity-discovery-100.json

      - name: Generate 1,000-record fixture
        run: node scripts/generate-opportunity-discovery-fixtures.mjs 1000 tmp/opportunity-discovery-1000.json

      - name: Generate 10,000-record fixture
        run: node scripts/generate-opportunity-discovery-fixtures.mjs 10000 tmp/opportunity-discovery-10000.json

      - name: Build shared package
        run: npm run build:shared

      - name: Build Functions
        run: npm run build:functions

      - name: Shared and Functions discovery tests
        run: node --test packages/shared/dist/opportunityDiscovery.test.js apps/functions/lib/opportunityDiscovery.test.js

      - name: Discovery reducer, URL, and location-provider tests
        run: npx vitest run apps/web/src/features/exchange/state/opportunityDiscoveryState.test.ts apps/web/src/features/exchange/data/opportunityLocationSearchProvider.test.ts

      - name: Compile configured browser acceptance suite
        run: npx playwright test --config=playwright.opportunity-discovery.config.ts --list

      - name: Lint
        run: npm run lint

      - name: Exchange tests
        run: npm run test:exchange

      - name: Development readiness tests
        run: npm run test:development-readiness

      - name: Week 1 organization reconciliation tests
        run: npm run test:week1-org

      - name: Index validation
        run: node scripts/merge-opportunity-discovery-indexes.mjs --check

      - name: Synthetic fixture validation
        run: node scripts/validate-opportunity-discovery-fixtures.mjs tmp/opportunity-discovery-100.json tmp/opportunity-discovery-1000.json tmp/opportunity-discovery-10000.json

      - name: Security tests
        run: npm run test:security

      - name: Run 3 regression tests
        run: npm run test:run3

      - name: Run 4 regression tests
        run: npm run test:run4

      - name: Production build
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check

      - name: Clean generated Functions output
        shell: bash
        run: |
          git restore apps/functions/lib
          git clean -fd apps/functions/lib
          test -z "$(git status --short -- apps/functions/lib)"

      - name: Upload synthetic fixtures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-discovery-synthetic-fixtures
          path: tmp/opportunity-discovery-*.json
          retention-days: 3
