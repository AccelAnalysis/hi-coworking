name: PR23 final application repair patch v2

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - ".github/workflows/pr23-final-application-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply corrected server and publication patches
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee final-application-patch.log
          from pathlib import Path

          def extract(path: str) -> str:
              source = Path(path).read_text()
              raw = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
              return "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())

          publication = extract(".github/workflows/pr23-publication-diagnostic-patch.yml")
          strict = '''def replace_once(path: Path, old: str, new: str) -> None:
    text = path.read_text()
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{path}: guarded replacement expected once, found {count}: {old[:100]!r}")
    path.write_text(text.replace(old, new, 1))'''
          idempotent = '''def replace_once(path: Path, old: str, new: str) -> None:
    text = path.read_text()
    count = text.count(old)
    if path.name == "index.ts" and "exchange_getOrganizationPublicationDiagnostic" in new:
        if count == 2:
            path.write_text(text.replace(old, new))
            return
        if count == 0 and text.count(new) == 2:
            return
    if count != 1:
        raise SystemExit(f"{path}: guarded replacement expected once, found {count}: {old[:100]!r}")
    path.write_text(text.replace(old, new, 1))'''
          if strict not in publication:
              raise SystemExit("Could not locate publication replacement helper")
          exec(compile(publication.replace(strict, idempotent, 1), "publication-patch", "exec"))

          server = extract(".github/workflows/pr23-server-contract-corrected.yml")
          needle = '''        actorOrganizationId: input.actorOrganizationId,
        subjectOrganizationId: input.organizationId,
        mode: input.mode,'''
          replacement = '''        contractVersion: CONTRACT_VERSION,
        actorOrganizationId: input.actorOrganizationId,
        subjectOrganizationId: input.organizationId,
        mode: input.mode,'''
          if server.count(needle) != 2:
              raise SystemExit(f"Expected two directory perspective call patterns, found {server.count(needle)}")
          exec(compile(server.replace(needle, replacement), "server-patch", "exec"))
          PY
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-final-application-patch-log
          path: final-application-patch.log
          if-no-files-found: error
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npm run lint
      - run: npm run test:exchange
      - run: npm run test:security
      - run: npm run build
      - run: git diff --check
      - name: Commit validated application repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/functions/src/exchange/organizationWorkspace.ts apps/functions/src/exchange/organizationEstablishments.ts apps/functions/src/index.ts apps/web/src/app/org/settings/page.tsx tests/exchange/organizationPublicationDiagnostic.test.ts
          git commit -m "fix(exchange): complete marker perspective and visibility repair"
          git pull --rebase origin codex/exchange-business-registration-map-activation
          git push origin HEAD:codex/exchange-business-registration-map-activation
