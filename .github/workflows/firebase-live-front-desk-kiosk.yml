name: Hi Coworking Firebase Front Desk Kiosk

# Manual only. Never runs on push or merge.
# Deploys the front-desk iPad kiosk callables and its one scheduled sweep
# from the isolated firebase/front-desk-kiosk-functions bundle (codebase "front-desk-kiosk").
# The first deploy creates ONE new Cloud Scheduler job (kiosk_attendanceSweep).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy front desk kiosk to deploy the "front-desk-kiosk" codebase only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hi-coworking-firebase-front-desk-kiosk
  cancel-in-progress: false

jobs:
  deploy-front-desk-kiosk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT || secrets.FIREBASE_SERVICE_ACCOUNT }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirm }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require main and the typed confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Refusing to deploy from ${GITHUB_REF}. Run this workflow from main." >&2
            exit 1
          fi
          if [[ "${DEPLOY_CONFIRMATION}" != "deploy front desk kiosk" ]]; then
            echo "Confirmation did not match. Type exactly: deploy front desk kiosk" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Firebase deployment credential
        shell: bash
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT}" ]]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT (or FIREBASE_SERVICE_ACCOUNT)." >&2
            exit 1
          fi

      - name: Prepare Google application credentials
        shell: bash
        run: |
          set -euo pipefail
          credential_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${credential_file}"
          chmod 600 "${credential_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credential_file}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Guard the Firebase project
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          const project = rc.projects && rc.projects.default;
          if (project !== 'hi-coworking-plat') {
            throw new Error(`Refusing to deploy: .firebaserc default project is ${project || '(missing)'}, expected hi-coworking-plat.`);
          }
          NODE

      # firebase.front-desk-kiosk.json's predeploy builds the isolated bundle first.
      # --only keeps every other codebase in place. Never add the force flag.
      - name: Deploy the front-desk-kiosk codebase only
        run: npx firebase deploy --config firebase.front-desk-kiosk.json --project hi-coworking-plat --only functions:front-desk-kiosk --non-interactive

      - name: Verify kiosk_session is reachable
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://us-central1-hi-coworking-plat.cloudfunctions.net/kiosk_session"
          response_file="${RUNNER_TEMP}/front-desk-kiosk-preflight.txt"
          status="$({ curl --silent --show-error --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://hi-coworking-plat.web.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            "${endpoint}"; } || true)"
          if [[ "${status}" != "200" && "${status}" != "204" ]]; then
            echo "kiosk_session is not reachable after deployment (HTTP ${status})." >&2
            cat "${response_file}" >&2 || true
            exit 1
          fi
