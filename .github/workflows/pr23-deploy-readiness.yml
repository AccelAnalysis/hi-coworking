name: PR23 deploy readiness

on:
  pull_request:
    branches:
      - codex/exchange-establishments-contact-routing
    paths:
      - .github/workflows/pr23-deploy-readiness.yml

permissions:
  contents: read
  id-token: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: exchange-development
    env:
      CANDIDATE_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CANDIDATE_FIREBASE_SERVICE_ACCOUNT_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HI_COWORKING_PLAT }}
      CANDIDATE_GOOGLE_CLOUD_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
      CANDIDATE_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      CANDIDATE_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      CANDIDATE_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      CANDIDATE_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      CANDIDATE_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exchange-business-registration-map-activation

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Detect safe deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          OUT=pr23-deploy-readiness.txt
          : > "$OUT"
          found_json=false
          for candidate in \
            CANDIDATE_FIREBASE_SERVICE_ACCOUNT \
            CANDIDATE_FIREBASE_SERVICE_ACCOUNT_PROJECT \
            CANDIDATE_GOOGLE_CLOUD_SERVICE_ACCOUNT \
            CANDIDATE_GCP_SERVICE_ACCOUNT_KEY \
            CANDIDATE_GCP_SA_KEY \
            CANDIDATE_GOOGLE_APPLICATION_CREDENTIALS_JSON \
            CANDIDATE_GOOGLE_CREDENTIALS; do
            value="${!candidate:-}"
            if [ -n "$value" ]; then
              echo "$candidate=PRESENT" | tee -a "$OUT"
              if [ "$found_json" = false ] && CREDENTIAL_VALUE="$value" python - <<'PY'
          import json, os
          value = os.environ.get("CREDENTIAL_VALUE", "")
          parsed = json.loads(value)
          assert isinstance(parsed, dict)
          assert parsed.get("type") == "service_account"
          assert parsed.get("project_id") == "hi-coworking-plat"
          PY
              then
                printf '%s' "$value" > /tmp/hi-coworking-service-account.json
                chmod 600 /tmp/hi-coworking-service-account.json
                echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/hi-coworking-service-account.json" >> "$GITHUB_ENV"
                found_json=true
                echo "SELECTED_SERVICE_ACCOUNT=$candidate" | tee -a "$OUT"
              fi
            else
              echo "$candidate=ABSENT" >> "$OUT"
            fi
          done
          if [ -n "${CANDIDATE_FIREBASE_TOKEN:-}" ]; then
            echo "CANDIDATE_FIREBASE_TOKEN=PRESENT" | tee -a "$OUT"
            echo "FIREBASE_TOKEN=${CANDIDATE_FIREBASE_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "CANDIDATE_FIREBASE_TOKEN=ABSENT" >> "$OUT"
          fi
          echo "SERVICE_ACCOUNT_SELECTED=$found_json" | tee -a "$OUT"

      - name: Probe Firebase authorization
        shell: bash
        run: |
          set -o pipefail
          npx firebase-tools@15.23.0 projects:list --json 2>&1 | tee -a pr23-deploy-readiness.txt

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-deploy-readiness
          path: pr23-deploy-readiness.txt
          if-no-files-found: error
          retention-days: 3
