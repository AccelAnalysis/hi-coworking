name: Exchange Week 1 acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/exchange-week-1-acceptance]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:shared
      - run: npm run build:functions
      - run: npx tsc --noEmit -p apps/web/tsconfig.json
      - run: npm run test:exchange-unit
      - run: npm run test:security
      - run: npm run test:exchange-emulator
      - run: npm run test:browser:emulator
      - run: python3 apps/functions/scripts/verify-organization-seed.py data/seed/prepared/isle-of-wight-organizations.jsonl
      - run: npm run lint
      - run: npm run build
        env:
          SKIP_BOOKSTORE_SYNC: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-hi-coworking.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-hi-coworking
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-hi-coworking.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo
      - name: Verify generated Functions output is synchronized
        run: git diff --exit-code -- apps/functions/lib
      - run: git diff --check
